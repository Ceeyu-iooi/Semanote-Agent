server.address=${SEMANOTE_BIND_ADDRESS:127.0.0.1}
server.port=${SEMANOTE_PORT:8080}
server.error.include-message=never
spring.datasource.url=${SEMANOTE_DB_URL:jdbc:mysql://127.0.0.1:3307/semanote?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_bin&serverTimezone=UTC}
spring.datasource.username=${SEMANOTE_DB_USER:semanote}
spring.datasource.password=${SEMANOTE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.web.resources.static-locations=file:frontend/dist/
spring.jackson.deserialization.fail-on-unknown-properties=true
semanote.project-root=${SEMANOTE_PROJECT_ROOT:.}
semanote.python=${SEMANOTE_PYTHON:python}
semanote.lan-hosts=${SEMANOTE_LAN_HOSTS:}
semanote.seed-corpus=${SEMANOTE_SEED_CORPUS:true}
logging.level.root=WARN
spring.main.banner-mode=off
