<style>
:root {
  color-scheme: light dark;
  --background: light-dark(#ffffff, #17191b);

  --card: light-dark(#f6f8fa, #212529);

  --muted-foreground: light-dark(#555e68, #b2bac2);

* { box-sizing: border-box; }
body { max-width: 920px; margin: 0 auto; padding: 24px; background: var(--background); color: var(--foreground); font-family: system-ui, 'Microsoft YaHei', sans-serif; font-size: var(--font-size-base); line-height: 1.7; }
h1, h2, h3 { font-weight: 500; }
h2 { font-size: 1.5rem; margin-block: 0 0.75rem; }
h3 { font-size: 1.05rem; margin-block: 0.75rem; }
.text-small { font-size: 12px; }
.text-muted { color: var(--muted-foreground); }
.viz-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-block: 12px; }
.card { padding: 16px; background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: 12px; margin-block: 16px; }
.btn { font: inherit; min-height: 36px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; color: var(--foreground); background: transparent; cursor: pointer; }
.btn:hover { background: var(--accent); color: var(--accent-foreground); }
.btn-primary, .btn[aria-pressed='true'] { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:focus-visible, summary:focus-visible { outline: 2px solid var(--foreground); outline-offset: 3px; }
.viz-badge { color: var(--muted-foreground); font-size: 12px; }
.cursor-interaction { cursor: pointer; }
details { margin-block: 12px; }
summary { min-height: 32px; }
pre, code { font-family: inherit; }
noscript { display: block; margin: 16px; }
@media (max-width: 480px) { body { padding: 16px; } }
@media (pointer: coarse) { .btn, summary { min-height: 44px; } }

</style>

  <script>
    (() => {
      const root = document.getElementById('semanote-workflow');
      const payload = JSON.parse(document.getElementById('semanote-workflow-data').textContent);
      const field = name => root.querySelector('[data-role="' + name + '"]');
      const stageById = new Map(payload.stages.map(stage => [stage.id, stage]));
      const phaseOrder = payload.phases.flatMap(phase => payload.stages.filter(stage => stage.phaseId === phase.id).map(stage => stage.id));
      const statusNames = { pending: '尚未开始', prepared: '产物已准备 · 待验收', accepted: '用户已验收', inProgress: '执行中' };
      const firstStageId = payload.stages[0].id;
      let currentId = firstStageId;
      field('stage-count').textContent = payload.stages.length + ' 个开发步骤';

      // Only safe text nodes are used for source-derived labels and prompts.
      function renderList(target, values) {
        target.replaceChildren(...values.map(value => {
          const item = document.createElement('li');
          item.textContent = value;
          return item;
        }));
      }

      function rememberSelection() {
        if (window.openai && typeof window.openai.setWidgetState === 'function') {
          window.openai.setWidgetState({ modelContent: { selectedStage: currentId, workflowSchemaVersion: payload.schemaVersion }, privateContent: null }).catch(() => {});
        }
      }

      function selectStage(id, remember = false) {
        if (!stageById.has(id)) return;
        currentId = id;
        const stage = stageById.get(id);
        field('stage-title').textContent = stage.id + ' · ' + stage.title;
        field('stage-status').textContent = statusNames[stage.status] || stage.status;
        field('stage-goal').textContent = stage.goal;
        field('stage-dependencies').textContent = stage.dependsOn.length ? stage.dependsOn.join('、') + '（须有用户验收证据）' : '无';
        field('stage-decisions').textContent = stage.decisionIds.length ? stage.decisionIds.map(value => 'TBD[' + value + ']').join('、') : '无本阶段新增必决策项';
        renderList(field('stage-inputs'), [...payload.commonRead, ...stage.requiredRead]);
        renderList(field('stage-deliverables'), stage.deliverables);
        renderList(field('stage-checks'), stage.checks);
        field('stage-stop').textContent = '停止位置：' + stage.stopCondition;
        field('prompt-text').textContent = stage.promptText;
        field('copy-status').textContent = '';
        field('prompt-details').open = false;
        const index = phaseOrder.indexOf(id);
        field('previous').disabled = index === 0;
        field('next').disabled = index === phaseOrder.length - 1;
        for (const button of root.querySelectorAll('[data-stage-id]')) {
          button.setAttribute('aria-pressed', String(button.dataset.stageId === id));
        }
        if (remember) rememberSelection();
      }

      for (const phase of payload.phases) {
        const lane = document.createElement('div');
        lane.className = 'phase-lane';
        const label = document.createElement('span');
        label.className = 'phase-label';
        label.textContent = phase.title;
        const nodes = document.createElement('div');
        nodes.className = 'phase-nodes';
        for (const stage of payload.stages.filter(item => item.phaseId === phase.id)) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'btn';
          button.dataset.stageId = stage.id;
          button.dataset.tooltip = stage.title;
          button.setAttribute('aria-label', stage.id + ' ' + stage.title);
          button.setAttribute('aria-pressed', 'false');
          button.textContent = stage.id.slice(1) + ' · ' + stage.title;
          button.addEventListener('click', () => selectStage(stage.id, true));
          nodes.append(button);
        }
        lane.append(label, nodes);
        field('stage-map').append(lane);
      }

      field('previous').addEventListener('click', () => selectStage(phaseOrder[phaseOrder.indexOf(currentId) - 1], true));
      field('next').addEventListener('click', () => selectStage(phaseOrder[phaseOrder.indexOf(currentId) + 1], true));
      field('copy').addEventListener('click', async () => {
        const copiedId = currentId;
        const text = stageById.get(copiedId).promptText;
        let copyTimeout;
        try {
          if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('Clipboard unavailable');
          await Promise.race([
            navigator.clipboard.writeText(text),
            new Promise((_, reject) => { copyTimeout = setTimeout(() => reject(new Error('Clipboard timeout')), 1500); })
          ]);
          if (copiedId !== currentId) return;
          field('copy-status').textContent = '已复制 ' + copiedId + ' 的完整提示词';
        } catch (_) {
          if (copiedId !== currentId) return;
          // file:// and sandboxed previews may deny clipboard access.
          field('prompt-details').open = true;
          const range = document.createRange();
          range.selectNodeContents(field('prompt-text'));
          const selection = window.getSelection();
          if (selection) {
            selection.removeAllRanges();
            selection.addRange(range);
          }
          field('copy-status').textContent = '复制受浏览器限制，已展开并选中完整提示词。请按 Ctrl+C，或长按复制。';
        } finally {
          clearTimeout(copyTimeout);
        }
      });
      const savedState = window.openai && window.openai.widgetState && window.openai.widgetState.modelContent;
      const savedId = savedState && savedState.workflowSchemaVersion === payload.schemaVersion && stageById.has(savedState.selectedStage) ? savedState.selectedStage : firstStageId;
      selectStage(savedId);
      window.addEventListener('openai:set_globals', event => {
        const state = event.detail && event.detail.globals && event.detail.globals.widgetState;
        if (state && state.modelContent && state.modelContent.workflowSchemaVersion === payload.schemaVersion) selectStage(state.modelContent.selectedStage);
      });
    })();
  </script>
